
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Porsche 911 Turbo — City Drive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060608;
  font-family:'Segoe UI',Arial,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0;z-index:0}

/* ── Portrait warning ── */
#portrait-warn{display:none;position:fixed;inset:0;z-index:200;background:#060608;
  color:#e8c840;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;font-size:18px;text-align:center;padding:20px}
@media(orientation:portrait){#portrait-warn{display:flex}}

/* ── Loading screen ── */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;color:#fff;
  text-align:center;padding:20px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 60%,#130a1f 0%,#060608 70%)}
#loading::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 100%,rgba(232,80,16,.18) 0%,transparent 60%);
  pointer-events:none}
#loading h1{font-size:clamp(26px,7vw,58px);color:#e8c840;letter-spacing:clamp(4px,1.5vw,12px);
  margin-bottom:4px;font-weight:900;text-shadow:0 0 40px rgba(232,200,64,.4)}
#loading .sub{color:#666;font-size:clamp(9px,1.5vw,12px);letter-spacing:clamp(2px,1vw,5px);
  margin-bottom:clamp(20px,4vh,40px);text-transform:uppercase}
#load-car-icon{font-size:clamp(52px,10vw,80px);margin-bottom:clamp(12px,2.5vh,24px);
  filter:drop-shadow(0 0 20px rgba(232,200,64,.5));animation:carBob 2s ease-in-out infinite}
@keyframes carBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#bar-wrap{width:min(320px,72vw);height:5px;background:#111118;border-radius:3px;
  overflow:hidden;border:1px solid #2a2a3a;box-shadow:0 0 12px rgba(232,200,64,.1)}
#bar{height:100%;background:linear-gradient(90deg,#e8c840,#ff6600);width:0%;
  transition:width .3s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(232,200,64,.6)}
#load-status{margin-top:14px;font-size:clamp(9px,1.8vw,11px);color:#555;
  letter-spacing:2px;max-width:80%;word-wrap:break-word;min-height:1.4em}
#load-hint{margin-top:18px;font-size:clamp(8px,1.5vw,10px);color:#333;letter-spacing:1.5px}

/* ── HUD top bar ── */
#hud-top{position:fixed;top:0;left:0;right:0;height:clamp(44px,7vh,58px);z-index:10;
  pointer-events:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(10px,2vw,20px);
  background:linear-gradient(180deg,rgba(0,0,0,.88) 0%,transparent 100%)}
.hud-pill{display:flex;flex-direction:column;align-items:center;
  min-width:clamp(52px,10vw,80px)}
.hud-label{font-size:clamp(7px,1.2vw,9px);color:#e8c840;letter-spacing:2px;text-transform:uppercase}
.hud-val{font-size:clamp(16px,3.2vw,22px);font-weight:800;color:#fff;line-height:1}
.hud-unit{font-size:clamp(7px,1.1vw,9px);color:#555}

/* ── Speedo (bottom center) ── */
#speedo-wrap{position:fixed;bottom:clamp(10px,2vh,18px);left:50%;
  transform:translateX(-50%);z-index:10;pointer-events:none;
  display:flex;flex-direction:column;align-items:center}
#speedo{display:block;width:clamp(90px,14vw,120px);height:clamp(90px,14vw,120px)}
#gear-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:clamp(16px,3vw,22px);font-weight:900;color:#e8c840;text-align:center;
  line-height:1;text-shadow:0 0 10px rgba(232,200,64,.6)}
#gear-num{font-size:clamp(8px,1.2vw,11px);color:#555;margin-top:2px}

/* ── Damage & nitro bars ── */
#status-bars{position:fixed;bottom:clamp(110px,18vh,150px);left:50%;
  transform:translateX(-50%);z-index:10;pointer-events:none;
  display:flex;flex-direction:column;gap:5px;width:clamp(130px,22vw,180px)}
.sbar-row{display:flex;align-items:center;gap:6px}
.sbar-label{font-size:8px;color:#888;letter-spacing:1px;width:36px;text-align:right}
.sbar-track{flex:1;height:5px;background:#1a1a1a;border-radius:3px;overflow:hidden}
.sbar-fill{height:100%;border-radius:3px;transition:width .2s}
#health-fill{background:linear-gradient(90deg,#ff2200,#e8c840,#22cc44);width:100%}
#nitro-fill{background:linear-gradient(90deg,#0066ff,#00ccff);width:0%}

/* ── Nitro vignette ── */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(255,80,0,.7) 100%);
  transition:opacity .1s}

/* ── Speed lines overlay ── */
#speedlines{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(255,255,255,.04) 100%);
  transition:opacity .2s}

/* ── LANDSCAPE touch controls ────────────────────────────────── */
#controls{position:fixed;bottom:0;left:0;right:0;height:100%;z-index:10;
  pointer-events:none;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 clamp(10px,2.5vw,20px) clamp(10px,2.5vh,20px)}

/* Left cluster */
#ctrl-left{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.5vh,12px);pointer-events:none}
#steer-row{display:flex;gap:clamp(8px,1.5vw,14px)}

/* Right cluster */
#ctrl-right{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,10px);pointer-events:none}

/* Base button */
.btn{width:clamp(58px,10vw,74px);height:clamp(58px,10vw,74px);border-radius:50%;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  pointer-events:all;user-select:none;-webkit-user-select:none;touch-action:none;
  transition:background .08s,border-color .08s,box-shadow .08s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.btn svg{transition:transform .08s}
.btn:active,.btn.on{background:rgba(232,200,64,.28);border-color:rgba(232,200,64,.9);
  box-shadow:0 0 20px rgba(232,200,64,.45);transform:scale(.94)}

/* Accel — green tint */
#btn-accel{background:rgba(34,180,80,.13);border-color:rgba(34,180,80,.45)}
#btn-accel:active,#btn-accel.on{background:rgba(34,180,80,.42);border-color:#22cc44;
  box-shadow:0 0 22px rgba(34,200,80,.65)}

/* Brake — red tint */
#btn-brake{background:rgba(220,30,30,.13);border-color:rgba(220,30,30,.45)}
#btn-brake:active,#btn-brake.on{background:rgba(220,30,30,.42);border-color:#ff3333;
  box-shadow:0 0 22px rgba(255,50,50,.65)}

/* Nitro — rocket */
#btn-nitro{width:clamp(66px,11vw,82px);height:clamp(66px,11vw,82px);
  background:rgba(255,80,0,.16);border:2px solid rgba(255,110,0,.6);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  pointer-events:all;user-select:none;-webkit-user-select:none;touch-action:none;
  box-shadow:0 0 16px rgba(255,80,0,.38),inset 0 0 12px rgba(255,80,0,.1);
  transition:all .08s}
#btn-nitro:active,#btn-nitro.on{
  background:rgba(255,80,0,.58);border-color:#ff6600;
  box-shadow:0 0 32px rgba(255,100,0,.95),0 0 64px rgba(255,100,0,.4);
  transform:scale(.93)}

/* Steer label badges */
.steer-badge{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font-size:7px;color:#555;letter-spacing:1.5px;white-space:nowrap}
.btn-wrap{position:relative;display:flex;flex-direction:column;align-items:center}

/* Wrecked overlay */
#wrecked{position:fixed;inset:0;z-index:50;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.88);backdrop-filter:blur(6px)}
#wrecked h2{font-size:clamp(32px,7vw,52px);color:#ff2200;letter-spacing:6px;
  margin-bottom:8px;text-shadow:0 0 30px rgba(255,34,0,.6)}
#wrecked p{color:#888;font-size:clamp(12px,2vw,14px);margin-bottom:24px;letter-spacing:1px}
#wrecked button{padding:14px 40px;font-size:clamp(13px,2vw,15px);font-weight:700;
  background:linear-gradient(135deg,#e8c840,#ffaa00);color:#000;border:none;
  border-radius:10px;cursor:pointer;letter-spacing:2px;
  box-shadow:0 4px 20px rgba(232,200,64,.4);transition:transform .1s,box-shadow .1s}
#wrecked button:active{transform:scale(.95)}
</style>

<!-- Upgraded Global Error Catcher -->
<script>
  window.addEventListener('error', function(e) {
    var el = document.getElementById('load-status');
    if(el) { 
      var errText = e.message || "Unknown Script Error";
      el.innerHTML = 'ERROR:<br/>' + errText; 
      el.style.color = '#ff4444'; 
      el.style.fontWeight = 'bold';
    }
  }, true);
</script>

<body>

<!-- Portrait warning (game is landscape only) -->
<div id="portrait-warn">
  <svg width="56" height="56" viewBox="0 0 56 56"><rect x="10" y="4" width="36" height="48" rx="5" stroke="#e8c840" stroke-width="2" fill="none"/><path d="M28 42h.01" stroke="#e8c840" stroke-width="3" stroke-linecap="round"/><path d="M4 28h48M28 4v8" stroke="#e8c840" stroke-width="1.5" stroke-dasharray="3 3"/></svg>
  <strong style="font-size:22px;color:#e8c840">Rotate to Landscape</strong>

</div>

<!-- Loading -->
<div id="loading">
  <div id="load-car-icon">🏎️</div>
  <h1>PORSCHE 911</h1>
  <div class="sub">TURBO · 1975 · CITY DRIVE</div>
  <div id="bar-wrap"><div id="bar"></div></div>

<script type="module">
// ─── Imports (Now using the Import Map!) ───
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ─── Helpers ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const bar      = $('bar');
const loadStat = $('load-status');
function setProgress(p, msg){
  if(bar) bar.style.width = (p*100)+'%';
  if(msg && loadStat) loadStat.textContent = msg;
}

// ─── Renderer ────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, 1, 0.05, 900);

function resize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); 
resize();

// ─── Sky shader ───────────────────────────────────────────────────────────────
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms:{
    uTop:   {value:new THREE.Color(0x050310)},
    uMid:   {value:new THREE.Color(0x120828)},
    uHoriz: {value:new THREE.Color(0xff5010)},
    uSun:   {value:new THREE.Color(0xffe070)},
    uSunDir:{value:new THREE.Vector3(.5,.12,-.85).normalize()},
  },
  vertexShader:`varying vec3 vD; void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    uniform vec3 uTop,uMid,uHoriz,uSun,uSunDir;
    varying vec3 vD;
    void main(){
      vec3 d=normalize(vD);
      float h=d.y;
      vec3 c=mix(uHoriz,uMid,smoothstep(-.06,.28,h));
      c=mix(c,uTop,smoothstep(.18,.95,h));
      float sun=pow(max(dot(d,uSunDir),0.),220.);
      float glow=pow(max(dot(d,uSunDir),0.),7.)*.35;
      c+=uSun*sun+vec3(1.,.45,.1)*glow;
      gl_FragColor=vec4(c,1.);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(700,32,16), skyMat));

// Stars
{
  const g=new THREE.BufferGeometry();
  const p=new Float32Array(4000*3);
  for(let i=0;i<p.length;i+=3){
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=650+Math.random()*20;
    p[i]=r*Math.sin(ph)*Math.cos(th); p[i+1]=r*Math.cos(ph); p[i+2]=r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.9,sizeAttenuation:true})));
}

// Sun disc
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(7,16,16),new THREE.MeshBasicMaterial({color:0xffe050}));
sunDisc.position.copy(new THREE.Vector3(.5,.12,-.85).normalize().multiplyScalar(550));
scene.add(sunDisc);

// ─── Lighting ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x2a3050, 0.9));
const sunLight = new THREE.DirectionalLight(0xffd090, 1.6);
sunLight.position.set(60,90,-100);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(2048,2048);
Object.assign(sunLight.shadow.camera,{near:1,far:500,left:-150,right:150,top:80,bottom:-80});
scene.add(sunLight);

// Car head-lights effect
const headL = new THREE.SpotLight(0xffffff, 3, 35, .3, .5);
headL.castShadow=false;
scene.add(headL); scene.add(headL.target);

// ─── Road infinite loop ───────────────────────────────────────────────────────
const SEG_LEN   = 80;    // world units per road chunk
const NUM_SEGS  = 4;     // 4 chunks in pool
const ROAD_HALF = 6.8;   // driveable half-width (kerb to kerb)

// Ground fill
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(400,4000),
  new THREE.MeshLambertMaterial({color:0x0d0d10})
);
groundMesh.rotation.x=-Math.PI/2; groundMesh.position.set(0,-.01,-500);
groundMesh.receiveShadow=true; scene.add(groundMesh);

// Road surface material
const roadMat = new THREE.MeshLambertMaterial({color:0x181820});
// Kerb material
const kerbMatR = new THREE.MeshLambertMaterial({color:0xdd2222});
const kerbMatW = new THREE.MeshLambertMaterial({color:0xffffff});
// Lane dash
const dashMat  = new THREE.MeshBasicMaterial({color:0xffffff,opacity:.5,transparent:true});

// Pool entry: {group, z}
const segPool=[];

function buildSegment(){
  const g=new THREE.Group();
  // road
  const surf=new THREE.Mesh(new THREE.BoxGeometry(ROAD_HALF*2,.08,SEG_LEN),roadMat);
  surf.receiveShadow=true; g.add(surf);
  // kerbs alternating red/white every 4 units
  for(let side of[-1,1]){
    for(let k=0;k<SEG_LEN;k+=4){
      const c=(Math.floor(k/4)%2===0)?kerbMatR:kerbMatW;
      const kb=new THREE.Mesh(new THREE.BoxGeometry(.55,.28,4),c);
      kb.position.set(side*(ROAD_HALF+.28),.1,-SEG_LEN/2+k+2); g.add(kb);
    }
  }
  // centre dashes
  for(let d=0;d<SEG_LEN;d+=7){
    const dm=new THREE.Mesh(new THREE.PlaneGeometry(.22,4),dashMat);
    dm.rotation.x=-Math.PI/2; dm.position.set(0,.05,-SEG_LEN/2+d+2); g.add(dm);
  }
  // sidewalk
  [-1,1].forEach(s=>{
    const sw=new THREE.Mesh(new THREE.BoxGeometry(3,.2,SEG_LEN),
      new THREE.MeshLambertMaterial({color:0x222230}));
    sw.position.set(s*(ROAD_HALF+2.2),.06,0); sw.receiveShadow=true; g.add(sw);
  });
  scene.add(g);
  return g;
}

// Streetlight group pool
const lampPool=[];
function buildLampGroup(){
  const g=new THREE.Group();
  for(let side of[-1,1]){
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,9,6),
      new THREE.MeshLambertMaterial({color:0x444455}));
    pole.position.set(side*(ROAD_HALF+4), 4.5, 0); g.add(pole);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(side>0?-2.5:2.5,.12,.12),
      new THREE.MeshLambertMaterial({color:0x444455}));
    arm.position.set(side*(ROAD_HALF+4)+side*(-1.25),9,0); g.add(arm);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.28,8,8),
      new THREE.MeshBasicMaterial({color:0xfff0b0}));
    bulb.position.set(side*(ROAD_HALF+4)+side*(-2.5),9,0); g.add(bulb);
    const pl=new THREE.PointLight(0xffcc66,1.5,20);
    pl.position.copy(bulb.position); g.add(pl);
  }
  scene.add(g); return g;
}

// City buildings pool (2 per segment side, randomised)
const BUILD_COLORS=[0x1a2030,0x201828,0x28201a,0x182028,0x202218,0x181a22];
function buildCityGroup(cityGLB){
  if(cityGLB){
    const cl=cityGLB.clone();
    scene.add(cl); return {group:cl,isGLB:true};
  }
  // Procedural fallback
  const g=new THREE.Group();
  for(let side of[-1,1]){
    for(let bi=0;bi<3;bi++){
      const w=5+Math.random()*9, h=10+Math.random()*28, d=5+Math.random()*8;
      const bm=new THREE.MeshLambertMaterial({color:BUILD_COLORS[Math.floor(Math.random()*BUILD_COLORS.length)]});
      const bx=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bm);
      bx.position.set(side*(ROAD_HALF+7+Math.random()*10),h/2,-SEG_LEN/3+bi*(SEG_LEN/2.5));
      bx.castShadow=true; g.add(bx);
      // window glow rows
      for(let row=0;row<Math.floor(h/3.5);row++){
        for(let col=0;col<3;col++){
          if(Math.random()<.55){
            const wm=new THREE.Mesh(new THREE.PlaneGeometry(.7,.9),
              new THREE.MeshBasicMaterial({color:0xffee88,opacity:.4+Math.random()*.3,transparent:true}));
            wm.rotation.y=side>0?Math.PI:0;
            wm.position.set(bx.position.x+(side>0?-w/2-.01:w/2+.01),
              1.5+row*3.5+Math.random()*.5,
              bx.position.z-d/3+col*(d/2.5));
            g.add(wm);
          }
        }
      }
    }
  }
  scene.add(g); return {group:g,isGLB:false};
}

function placeSegment(entry,zCenter,cityGLB){
  entry.group.position.set(0,0,zCenter);
  entry.lamps.position.set(0,0,zCenter);
  entry.city.group.position.set(0,0,zCenter);
  entry.z=zCenter;
}

// Initialise pool
let cityGLB=null; // set after load
function initPool(){
  for(let i=0;i<NUM_SEGS;i++){
    const g=buildSegment();
    const lamps=buildLampGroup();
    const city=buildCityGroup(cityGLB);
    const entry={group:g,lamps,city,z:0};
    placeSegment(entry,-i*SEG_LEN,cityGLB);
    segPool.push(entry);
  }
}

// Recycle road segments that are too far behind
function recycleSegments(){
  let frontZ=Infinity;
  for(const s of segPool) if(s.z<frontZ) frontZ=s.z;
  for(const s of segPool){
    if(s.z > carZ + SEG_LEN*2){
      placeSegment(s, frontZ-SEG_LEN, cityGLB);
    }
  }
}

// ─── Exhaust particles ─────────────────────────────────────────────────────────
const PTCL=120;
let exGeo,exPos,exVel,exLife,exPts;
function initExhaust(){
  exGeo=new THREE.BufferGeometry();
  exPos=new Float32Array(PTCL*3); exVel=new Float32Array(PTCL*3); exLife=new Float32Array(PTCL);
  exGeo.setAttribute('position',new THREE.BufferAttribute(exPos,3));
  exPts=new THREE.Points(exGeo,new THREE.PointsMaterial({
    size:.16,transparent:true,opacity:.8,depthWrite:false,sizeAttenuation:true,color:0xff7700}));
  scene.add(exPts);
}

function tickExhaust(dt,accel,nitro){
  if(!exPts) return;
  // transform exhaust world pos from car local (~rear bumper)
  const ep=new THREE.Vector3(0,.35,1.8);
  ep.applyEuler(new THREE.Euler(0,carHeading,0));
  ep.add(new THREE.Vector3(carX,carY,carZ));
  for(let i=0;i<PTCL;i++){
    exLife[i]-=dt;
    if(exLife[i]<=0){
      exPos[i*3]=ep.x+(Math.random()-.5)*.2;
      exPos[i*3+1]=ep.y+Math.random()*.15;
      exPos[i*3+2]=ep.z+(Math.random()-.5)*.2;
      const fwd=speed*.04+.3;
      exVel[i*3]=(Math.random()-.5)*.4;
      exVel[i*3+1]=.3+Math.random()*.5;
      exVel[i*3+2]=Math.cos(carHeading)*fwd;
      exLife[i]=.35+Math.random()*.35;
    } else {
      exPos[i*3]+=exVel[i*3]*dt;
      exPos[i*3+1]+=exVel[i*3+1]*dt;
      exPos[i*3+2]+=exVel[i*3+2]*dt;
    }
  }
  exGeo.attributes.position.needsUpdate=true;
  exPts.material.color.setHex(nitro?0x0088ff:accel?0xff6600:0x666666);
  
  // FIX: Explicitly clear logic to avoid "Optional Chaining" (?. syntax) crash in older engines
  exPts.material.opacity = (accel || nitro) ? 0.8 : 0.25;
}

// ─── Skid marks ───────────────────────────────────────────────────────────────
const skidMat=new THREE.MeshBasicMaterial({color:0x080808,transparent:true,opacity:.6,depthWrite:false});
const skids=[];
function addSkid(x,z){
  if(skids.length>80){scene.remove(skids.shift());}
  const m=new THREE.Mesh(new THREE.PlaneGeometry(.38,1.1),skidMat.clone());
  m.rotation.x=-Math.PI/2; m.rotation.z=carHeading;
  m.position.set(x,.003,z); scene.add(m); skids.push(m);
}

// ─── Car physics state ────────────────────────────────────────────────────────
let carX=0, carY=0, carZ=0, carHeading=0;
let speed=0;         // m/s forward
let steerAngle=0;    // current wheel steer angle
let nitroCharges=3;  // how many nitro boosts left
let nitroActive=0;   // seconds remaining of current boost
let nitroCooldown=0;
let health=1.0;
let totalDist=0, topSpeed=0;
let crashed=false;

// Tuning constants
const MASS         = 1100;   // kg (affects feel)
const ENGINE_FORCE = 22;     // accel power
const BRAKE_FORCE  = 38;
const FRICTION_K   = 10;
const STEER_MAX    = .032;   // max steer per second (radians)
const STEER_RETURN = 4;      // how fast wheel returns to centre
const SPEED_MAX    = 32;     // m/s ≈ 115 km/h
const SPEED_NITRO  = 58;     // m/s ≈ 210 km/h
const NITRO_TIME   = 3.5;
const NITRO_RECHARGE_DIST = 800; // m driven to earn 1 charge
let distSinceRecharge=0;

// Gear ratios
const GEARS_KMH=[0,20,45,78,115,160,200,280];
function getGear(kmh){
  for(let i=GEARS_KMH.length-1;i>=0;i--) if(kmh>=GEARS_KMH[i]) return i;
  return 0;
}

// ─── Wheel nodes ───────────────────────────────────────
const WHEEL_NAMES=['Circle.038_1','Circle.050_51','Circle.037_2','Circle.051_37','Circle.048_52'];
const FRONT_WHEELS=['Circle.038_1','Circle.050_51'];
let wheelNodes=[], frontWheelNodes=[];

// ─── Load GLBs ────────────────────────────────────────────────────────────────
const draco = new DRACOLoader();
// jsDelivr mirrors the same decoder files — more reliable on Indian mobile than gstatic
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/gltf/');
draco.setDecoderConfig({ type: 'js' }); // force pure-JS decoder, no WASM fetch needed
draco.preload(); // kick off decoder fetch NOW, before GLB arrives
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const carGroup=new THREE.Group();
scene.add(carGroup);

function loadCar(){
  return new Promise(resolve=>{
    let done=false;
    let stallTimer=null;
    const fallback=(reason)=>{
      if(done) return; done=true;
      clearTimeout(stallTimer);
      console.warn('car.glb fallback:',reason);
      setProgress(.45,'USING FALLBACK CAR…');
      buildBoxCar(); resolve(false);
    };
    const resetStall=()=>{
      clearTimeout(stallTimer);
      stallTimer=setTimeout(()=>fallback('stalled'),8000);
    };
    resetStall(); // initial 8s boot timeout
    loader.load(
      './models/car.glb',
      gltf=>{
        if(done) return; done=true; clearTimeout(stallTimer);
        setProgress(.43,'DECODING CAR MESH…');
        const model=gltf.scene;
        const box=new THREE.Box3().setFromObject(model);
        const sz=new THREE.Vector3(); box.getSize(sz);
        const sc=4.5/sz.z; model.scale.setScalar(sc);
        box.setFromObject(model);
        const mn=new THREE.Vector3(); box.getMin(mn);
        model.position.y=-mn.y;
        model.traverse(n=>{
          if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}
          if(WHEEL_NAMES.includes(n.name)){
            wheelNodes.push(n);
            if(FRONT_WHEELS.includes(n.name)) frontWheelNodes.push(n);
          }
        });
        carGroup.add(model);
        resolve(true);
      },
      xhr=>{
        resetStall(); // still downloading — reset stall timer
        const kb=xhr.loaded/1024|0;
        const pct=xhr.total>0?xhr.loaded/xhr.total:0;
        // When download hits 100% — show decoding message
        if(pct>=0.99) setProgress(.42,'DECODING CAR MODEL…');
        else setProgress(.03+pct*.39,'DOWNLOADING CAR… '+kb+'KB / '+(xhr.total/1024|0)+'KB');
      },
      err=>fallback(err)
    );
  });
}

function buildBoxCar(){
  const mats={body:new THREE.MeshLambertMaterial({color:0xcccccc}),
    glass:new THREE.MeshLambertMaterial({color:0x334455,transparent:true,opacity:.7}),
    wheel:new THREE.MeshLambertMaterial({color:0x111111}),
    rim:new THREE.MeshLambertMaterial({color:0x777788})};
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.7,4.3),mats.body);
  body.position.y=.44; body.castShadow=true; carGroup.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.4,.55,1.8),mats.body);
  roof.position.set(0,.96,-.1); carGroup.add(roof);
  const wind=new THREE.Mesh(new THREE.PlaneGeometry(1.35,.6),mats.glass);
  wind.rotation.x=-.4; wind.position.set(0,.98,-.9); carGroup.add(wind);
  [[-.96,.42,-1.3],[.96,.42,-1.3],[-.86,.42,1.3],[.86,.42,1.3]].forEach((p,i)=>{
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.34,14),mats.wheel);
    w.rotation.z=Math.PI/2; w.position.set(...p); w.castShadow=true; carGroup.add(w);
    const r=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.36,6),mats.rim);
    r.rotation.z=Math.PI/2; r.position.set(...p); carGroup.add(r);
    wheelNodes.push(w);
    if(i<2) frontWheelNodes.push(w);
  });
}

function loadRoad(){
  return new Promise(resolve=>{
    let done=false;
    let stallTimer=null;
    const fallback=(reason)=>{
      if(done) return; done=true;
      clearTimeout(stallTimer);
      console.warn('road.glb fallback:',reason);
      setProgress(.95,'USING PROCEDURAL CITY…');
      resolve(false);
    };
    const resetStall=()=>{
      clearTimeout(stallTimer);
      stallTimer=setTimeout(()=>fallback('stalled'),8000);
    };
    resetStall();
    loader.load(
      './models/road.glb',
      gltf=>{
        if(done) return; done=true; clearTimeout(stallTimer);
        const model=gltf.scene;
        const box=new THREE.Box3().setFromObject(model);
        const sz=new THREE.Vector3(); box.getSize(sz);
        const sc=120/Math.max(sz.x,sz.z,1);
        model.scale.setScalar(sc);
        const mn=new THREE.Vector3(); box.getMin(mn);
        model.position.y=-mn.y*sc;
        model.traverse(n=>{ if(n.isMesh){n.castShadow=true;n.receiveShadow=true;} });
        cityGLB=model;
        resolve(true);
      },
      xhr=>{
        resetStall();
        const pct=xhr.total>0?xhr.loaded/xhr.total:0;
        setProgress(.45+pct*.48,'LOADING CITY… '+(xhr.loaded/1024|0)+'KB');
      },
      err=>fallback(err)
    );
  });
}
// ─── Input ────────────────────────────────────────────────────────────────────
const K=new Set();
window.addEventListener('keydown',e=>{ K.add(e.code);
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup',e=>K.delete(e.code));

function bindBtn(id,code){
  const el=$(id);
  if (!el) return;
  const on=()=>{ K.add(code); el.classList.add('on'); };
  const off=()=>{ K.delete(code); el.classList.remove('on'); };
  el.addEventListener('touchstart',e=>{ on(); e.preventDefault(); },{passive:false});
  el.addEventListener('touchend',  e=>{ off(); e.preventDefault(); },{passive:false});
  el.addEventListener('touchcancel',off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup',   off);
  el.addEventListener('mouseleave',off);
}
bindBtn('btn-left','KeyA');
bindBtn('btn-right','KeyD');
bindBtn('btn-accel','KeyW');
bindBtn('btn-brake','KeyS');
bindBtn('btn-nitro','Space');

// ─── Speedo renderer ──────────────────────────────────────────────────────────
const speedoCanvas = $('speedo');
const sCtx = speedoCanvas ? speedoCanvas.getContext('2d') : null;
function drawSpeedo(kmh,maxKmh){
  if (!sCtx) return;
  const W=120,cx=60,cy=62,r=46;
  sCtx.clearRect(0,0,W,W);
  sCtx.beginPath(); sCtx.arc(cx,cy,r,Math.PI*.72,Math.PI*2.28);
  sCtx.strokeStyle='#1a1a22'; sCtx.lineWidth=10; sCtx.stroke();
  const pct=Math.min(kmh/maxKmh,1);
  if(pct>0){
    const grad=sCtx.createLinearGradient(cx-r,cy,cx+r,cy);
    grad.addColorStop(0,'#22cc44'); grad.addColorStop(.55,'#e8c840'); grad.addColorStop(1,'#ff2200');
    sCtx.beginPath(); sCtx.arc(cx,cy,r,Math.PI*.72,Math.PI*.72+pct*Math.PI*1.56);
    sCtx.strokeStyle=grad; sCtx.lineWidth=10; sCtx.stroke();
  }
  for(let i=0;i<=10;i++){
    const a=Math.PI*.72+i/10*Math.PI*1.56;
    const x1=cx+Math.cos(a)*(r-7), y1=cy+Math.sin(a)*(r-7);
    const x2=cx+Math.cos(a)*(r+2), y2=cy+Math.sin(a)*(r+2);
    sCtx.beginPath(); sCtx.moveTo(x1,y1); sCtx.lineTo(x2,y2);
    sCtx.strokeStyle=i%5===0?'#e8c840':'#333'; sCtx.lineWidth=i%5===0?2:1; sCtx.stroke();
  }
}

// ─── Camera ───────────────────────────────────────────────────────────────────
let camPos=new THREE.Vector3(0,3,8);
let camTarget=new THREE.Vector3(0,1,0);
let camShake=0;

function updateCamera(dt){
  const kmh=Math.abs(speed)*3.6;
  const targetFOV=65+(kmh/280)*18;
  camera.fov+=(targetFOV-camera.fov)*.06;
  camera.updateProjectionMatrix();

  const backDist=5.5+(kmh/280)*2.5;
  const upDist=1.8+(kmh/280)*.8;
  const tx=carX-Math.sin(carHeading)*backDist;
  const tz=carZ+Math.cos(carHeading)*backDist;
  camPos.lerp(new THREE.Vector3(tx,carY+upDist,tz),.1);
  camTarget.lerp(new THREE.Vector3(carX,carY+.7,carZ),.16);

  if(camShake>0){
    camPos.x+=(Math.random()-.5)*camShake;
    camPos.y+=(Math.random()-.5)*camShake*.4;
    camShake=Math.max(0,camShake-.04);
  }
  camera.position.copy(camPos);
  camera.lookAt(camTarget);

  const hlPos=new THREE.Vector3(0,.8,-2.5);
  hlPos.applyEuler(new THREE.Euler(0,carHeading,0));
  hlPos.add(new THREE.Vector3(carX,carY,carZ));
  headL.position.copy(hlPos);
  const hlTgt=new THREE.Vector3(0,.5,-18);
  hlTgt.applyEuler(new THREE.Euler(0,carHeading,0));
  hlTgt.add(new THREE.Vector3(carX,carY,carZ));
  headL.target.position.copy(hlTgt);
  headL.target.updateMatrixWorld();
  headL.intensity=3;
}

// ─── HUD update ───────────────────────────────────────────────────────────────
function updateHUD(){
  const kmh=Math.abs(speed)*3.6;
  if(kmh>topSpeed) topSpeed=kmh;
  $('h-spd').textContent=Math.round(kmh);
  $('h-dist').textContent=totalDist>1000?(totalDist/1000).toFixed(2)+' km':Math.round(totalDist)+' m';
  $('h-top').textContent=Math.round(topSpeed);
  $('h-nitro-cnt').textContent=nitroCharges;
  $('health-fill').style.width=(health*100)+'%';
  const nitroBarPct=nitroActive>0?(nitroActive/NITRO_TIME*100):0;
  $('nitro-fill').style.width=nitroBarPct+'%';
  const gear=kmh<2?'N':getGear(kmh);
  $('gear-letter').textContent=gear;
  const maxKmh=nitroActive>0?220:160;
  drawSpeedo(kmh,maxKmh);
  $('vignette').style.opacity=nitroActive>0?'1':'0';
  $('speedlines').style.opacity=Math.min((kmh-80)/80,1)>0?Math.min((kmh-80)/80,1):'0';
}

// ─── Physics step ─────────────────────────────────────────────────────────────
const FIXED_DT=1/60;
let accumulator=0;

function physicsStep(){
  if(crashed) return;
  const accel=K.has('KeyW')||K.has('ArrowUp');
  const brake=K.has('KeyS')||K.has('ArrowDown');
  const left =K.has('KeyA')||K.has('ArrowLeft');
  const right=K.has('KeyD')||K.has('ArrowRight');
  const nos  =K.has('Space');

  if(nos && nitroActive<=0 && nitroCooldown<=0 && nitroCharges>0){
    nitroActive=NITRO_TIME; nitroCooldown=6; nitroCharges--;
    camShake=.18;
  }
  if(nitroActive>0) nitroActive=Math.max(0,nitroActive-FIXED_DT);
  if(nitroCooldown>0) nitroCooldown=Math.max(0,nitroCooldown-FIXED_DT);

  const topSpd=nitroActive>0?SPEED_NITRO:SPEED_MAX;

  if(accel) speed=Math.min(speed+ENGINE_FORCE*FIXED_DT*(nitroActive>0?2.4:1),topSpd);
  else if(brake) speed=Math.max(speed-BRAKE_FORCE*FIXED_DT,-6);
  else speed=speed>0?Math.max(speed-FRICTION_K*FIXED_DT,0)
                    :Math.min(speed+FRICTION_K*FIXED_DT,0);

  const kmh=Math.abs(speed)*3.6;
  const steerRate=STEER_MAX*(1-Math.min(kmh/220,.65));
  if(left  && Math.abs(speed)>.5) steerAngle=Math.min(steerAngle+steerRate, .45);
  else if(right && Math.abs(speed)>.5) steerAngle=Math.max(steerAngle-steerRate,-.45);
  else steerAngle*=(1-STEER_RETURN*FIXED_DT);

  const turnRate=steerAngle*(Math.abs(speed)/SPEED_MAX)*1.2;
  carHeading+=turnRate;

  carX+=Math.sin(carHeading)*speed*FIXED_DT;
  carZ-=Math.cos(carHeading)*speed*FIXED_DT;

  if(Math.abs(carX)>ROAD_HALF+.5){
    const dmg=Math.abs(speed)*.012;
    health=Math.max(0,health-dmg);
    carX=Math.sign(carX)*(ROAD_HALF+.5);
    speed*=-.25; 
    camShake=Math.min(camShake+.12,.35);
    if(health<=0) wreck();
  }

  if(Math.abs(steerAngle)>.28 && kmh>40 && Math.random()<.35){
    addSkid(carX+(Math.random()-.5)*.6, carZ+(Math.random()-.5)*.3);
  }

  totalDist+=Math.abs(speed)*FIXED_DT;
  distSinceRecharge+=Math.abs(speed)*FIXED_DT;
  if(distSinceRecharge>NITRO_RECHARGE_DIST && nitroCharges<5){
    nitroCharges++; distSinceRecharge=0;
  }

  carGroup.position.set(carX,carY,carZ);
  carGroup.rotation.y=carHeading;
  
  const rollTarget=steerAngle*1.8*(Math.min(kmh,120)/120);
  carGroup.rotation.z+=(rollTarget-carGroup.rotation.z)*.12;
  
  // FIX: Explicitly clarify ternary syntax logic to avoid optional chaining crash
  const pitchTarget = brake ? -0.04 : (accel ? 0.02 : 0);
  carGroup.rotation.x+=(pitchTarget-carGroup.rotation.x)*.1;

  const spinDelta=speed*FIXED_DT*2.8;
  for(const w of wheelNodes) w.rotation.x+=spinDelta;
  for(const w of frontWheelNodes) w.rotation.y=steerAngle*3.5;

  recycleSegments();
}

function wreck(){
  crashed=true;
  speed=0;
  $('wreck-stats').textContent=
    `Distance: ${totalDist>1000?(totalDist/1000).toFixed(2)+' km':Math.round(totalDist)+' m'} · Top Speed: ${Math.round(topSpeed)} km/h`;
  $('wrecked').style.display='flex';
}

// ─── Animation loop ───────────────────────────────────────────────────────────
const clock=new THREE.Clock();
let gameRunning=false;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);

  if(gameRunning){
    accumulator+=dt;
    while(accumulator>=FIXED_DT){ physicsStep(); accumulator-=FIXED_DT; }
    tickExhaust(dt, K.has('KeyW')||K.has('ArrowUp'), nitroActive>0);
    updateCamera(dt);
    updateHUD();
  }
  renderer.render(scene,camera);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
async function boot(){
  try {
    setProgress(.02,'LOADING CAR MODEL…');
    await loadCar();
    setProgress(.47,'LOADING CITY…');
    await loadRoad();
    setProgress(.95,'BUILDING WORLD…');
    initExhaust();
    initPool();
    carX=0; carZ=0; carHeading=0;
    setProgress(1,'READY ✓');
    await new Promise(r=>setTimeout(r,350));
    const loadingScreen=$('loading');
    if(loadingScreen) loadingScreen.style.display='none';
    gameRunning=true;
    clock.start();
    animate();
  } catch(e) {
    console.error(e);
    // Show a helpful retry button instead of silent freeze
    const statEl=$('load-status');
    if(statEl){
      statEl.style.color='#ff4444';
      statEl.textContent='LOAD FAILED — TAP TO RETRY';
      statEl.style.cursor='pointer';
      statEl.style.textDecoration='underline';
      statEl.onclick=()=>location.reload();
    }
    const barEl=$('bar');
    if(barEl) barEl.style.background='#ff3333';
  }
}

boot();
